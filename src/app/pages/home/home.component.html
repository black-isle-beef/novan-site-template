<section class="site-hero site-hero-home" aria-labelledby="home-heading">
  <img
    class="site-hero-image"
    ngSrc="/hero-images/bg-image-home-page.jpg"
    fill
    priority
    alt=""
    aria-hidden="true"
  />
  <div class="site-hero-content">
    <p class="text-uppercase fw-semibold small mb-3">Welcome to {{ siteConfig.companyName }}</p>
    <h1 id="home-heading" class="display-4 mb-3">Build a clearer digital presence.</h1>
    <p class="lead col-lg-8 mb-4">A thoughtful Angular foundation for your next site, product, or idea.</p>
    <a class="btn btn-primary" routerLink="/about">Explore {{ siteConfig.companyName }}</a>
  </div>
</section>
