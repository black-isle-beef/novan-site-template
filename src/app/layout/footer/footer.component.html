<footer class="border-top bg-body-tertiary mt-auto py-4">
  <div class="container">
    <div class="align-items-center d-flex flex-column flex-md-row gap-3 justify-content-between">
      <div>
        <p class="fw-semibold mb-1">{{ siteConfig.companyName }}</p>
        <p class="text-body-secondary mb-0">{{ siteConfig.brandTagline }}</p>
      </div>
      <div class="d-flex gap-2" aria-label="Social media links">
        <a class="social-link text-body" [href]="siteConfig.socialLinks.instagram" aria-label="Instagram"><i class="bi bi-instagram" aria-hidden="true"></i></a>
        <a class="social-link text-body" [href]="siteConfig.socialLinks.linkedin" aria-label="LinkedIn"><i class="bi bi-linkedin" aria-hidden="true"></i></a>
        <a class="social-link text-body" [href]="siteConfig.socialLinks.x" aria-label="X"><i class="bi bi-twitter-x" aria-hidden="true"></i></a>
        <a class="social-link text-body" [href]="siteConfig.socialLinks.facebook" aria-label="Facebook"><i class="bi bi-facebook" aria-hidden="true"></i></a>
      </div>
    </div>
    <div class="align-items-center border-top d-flex flex-column flex-sm-row gap-2 justify-content-between mt-4 pt-3">
      <small class="text-body-secondary">{{ siteConfig.copyrightNotice }}</small>
      <div class="d-flex gap-3">
        <a class="footer-link" routerLink="/privacy">Privacy Policy</a>
        <button type="button" class="footer-link footer-cookie-button" (click)="showCookiePreferences()">Cookie Policy</button>
      </div>
    </div>
  </div>
</footer>
